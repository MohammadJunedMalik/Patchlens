[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchlens"
version = "0.1.0"
description = "Web Security Assessment & Fix Verification Engine"
readme = "Readme.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohammad Juned Malik" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
patchlens = "patchlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["patchlens"]
